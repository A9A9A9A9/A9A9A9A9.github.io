<!DOCTYPE html>
<html>
<head>
  <base href="https://cdn.jsdelivr.net/gh/a9a9a9a9/a9a9a9a9.github.io@main/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="囧皮里 - 点对点宠物救助领养平台">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="囧皮里">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>囧皮里 - 宠物救助领养</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #FFF8F0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #FFF8F0; z-index: 9999; }
    #loading .logo { font-size: 64px; margin-bottom: 16px; animation: bounce 1.5s infinite; }
    #loading .title { font-size: 24px; color: #4A3728; font-weight: 700; margin-bottom: 8px; }
    #loading .subtitle { font-size: 14px; color: #9B8B7A; }
    #loading .spinner { width: 36px; height: 36px; border: 3px solid #FFE0CC; border-top: 3px solid #FF8C42; border-radius: 50%; animation: spin 0.8s linear infinite; margin-top: 24px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    #error-msg { display: none; margin-top: 16px; color: #FF5252; font-size: 13px; text-align: center; padding: 0 32px; max-width: 400px; }
    #status { margin-top: 12px; font-size: 12px; color: #9B8B7A; text-align: center; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="logo">🐱</div>
    <div class="title">囧皮里</div>
    <div class="subtitle">给流浪毛孩子一个温暖的家</div>
    <div class="spinner"></div>
    <div id="status"></div>
    <div id="error-msg"></div>
  </div>
  <script>
    var statusEl = document.getElementById('status');
    var errorEl = document.getElementById('error-msg');
    function setStatus(msg) { if (statusEl) statusEl.textContent = msg; }
    function showError(msg) { if (errorEl) { errorEl.style.display = 'block'; errorEl.textContent = msg; } }

    window.onerror = function(msg, url, line) { showError('JS错误: ' + msg + ' (行' + line + ')'); };
    window.onunhandledrejection = function(e) { showError('Promise错误: ' + (e.reason ? e.reason.message || e.reason : e)); };

    setStatus('加载资源中...');

    // 清除旧的service worker缓存
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(reg) { reg.unregister(); });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // 超时提示
    setTimeout(function() {
      if (!document.querySelector('flt-glass-pane')) {
        showError('应用加载超时，请检查网络后刷新页面');
      }
    }, 30000);
  </script>
</body>
</html>
